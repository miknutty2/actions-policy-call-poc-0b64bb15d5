name: GH Bounty Cache Boundary
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.comment.body == 'GH_BOUNTY_CACHE_BOUNDARY_TRIGGER_20261010'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create harmless marker
        run: printf 'GH_BOUNTY_CACHE_MARKER_20261010\n' > cache-marker.txt
      - name: Attempt cache save
        uses: actions/cache/save@v4
        with:
          path: cache-marker.txt
          key: ghb-cache-boundary-20261010-${{ github.event_name }}-${{ github.run_id }}
  called_probe:
    if: github.event_name == 'workflow_dispatch' || github.event.comment.body == 'GH_BOUNTY_CACHE_BOUNDARY_TRIGGER_20261010'
    uses: ./.github/workflows/ghb-cache-child.yml
    permissions:
      contents: read
