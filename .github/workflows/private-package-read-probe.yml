name: Ungranted private package write boundary
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt harmless new version with this repository token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p package-probe
          echo '{"name":"@miknutty2/gh-bounty-private-pkg-probe-20261009","version":"1.0.1","description":"Harmless ungranted write boundary probe","publishConfig":{"registry":"https://npm.pkg.github.com"}}' > package-probe/package.json
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > package-probe/.npmrc
          cd package-probe
          if npm publish --registry=https://npm.pkg.github.com --access restricted --ignore-scripts --fetch-retries=0; then
            echo UNGRANTED_PACKAGE_WRITE_SUCCEEDED
          else
            echo UNGRANTED_PACKAGE_WRITE_DENIED
          fi
