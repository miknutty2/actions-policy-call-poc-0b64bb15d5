name: Harmless npm OIDC dist-tag boundary test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test_dist_tag_permission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --global npm@11.21.0
      - run: npm dist-tag add @satori99/ghb-stage-boundary-20261010-942376d4@0.0.2 ghb-boundary-20261010
