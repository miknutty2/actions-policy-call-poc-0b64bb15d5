name: GH Bounty Cache Reusable Child
on:
  workflow_call:
jobs:
  save:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create harmless child marker
        run: printf 'GH_BOUNTY_REUSABLE_CACHE_MARKER_20261010\n' > child-cache-marker.txt
      - name: Attempt called-job cache save
        uses: actions/cache/save@v4
        with:
          path: child-cache-marker.txt
          key: ghb-called-cache-boundary-20261010-${{ github.event_name }}-${{ github.run_id }}
