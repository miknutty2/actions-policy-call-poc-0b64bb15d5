name: GHB Review Direct Control
on:
  pull_request_target:
    types: [reopened]
permissions:
  contents: read
jobs:
  direct_control:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt same fork SHA without unsafe opt-in
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Should not execute
        run: echo GHB_DIRECT_CONTROL_UNEXPECTED_1011
